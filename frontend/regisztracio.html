<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Regisztráció – Mérleg.hu</title>
    <script src="index.js"></script>
</head>
<body class="auth-page">
    <div class="brand">Mérleg<span>.hu</span></div>
    <div class="container">
        <h1>Regisztráció</h1>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="pelda@email.hu" required>
            <label for="name">Név</label>
            <input type="text" id="name" placeholder="Teljes név" required>
            <label class="checkbox-label">
                <input type="checkbox" id="bolt" name="bolt">
                Bolt (eladó fiók)
            </label>
            <label for="pwd">Jelszó</label>
            <input type="password" id="pwd" placeholder="••••••••" required>
            <button type="button" onclick="regisztracio()">Regisztráció</button>
        </form>
        <p>Van már fiókod? <a href="index.html">Bejelentkezés</a></p>
    </div>
</body>
</html>
